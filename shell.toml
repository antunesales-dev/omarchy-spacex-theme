# SpaceX.com chrome: black overlay, white type, photo is the page.

[bar]
background       = "#000000"
background-alpha = 1.0
text             = "#FFFFFF"
active           = "#FFFFFF"
scale-with-font  = true
size-horizontal  = 34
size-vertical    = 36

[hyprland]
active-border            = "rgba(ffffffff)"
active-border-foreground = "#FFFFFF"

[controls]
normal-color        = "#FFFFFF"
normal-fill-alpha   = 0.0
normal-border       = "#FFFFFF"
normal-border-width = 0
normal-border-alpha = 0.0

hover-cursor-color        = "#FFFFFF"
hover-cursor-fill-alpha   = 0.0
hover-cursor-border       = "#FFFFFF"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#FFFFFF"
focus-fill-alpha   = 1.0
focus-border       = "#FFFFFF"
focus-border-width = 0
focus-border-alpha = 0.0

selected-color        = "#FFFFFF"
selected-fill-alpha   = 1.0
selected-border       = "#FFFFFF"
selected-border-width = 0
selected-border-alpha = 0.0

pressed-fill-alpha   = 1.0
selection-fill-alpha = 1.0
selection-color      = "#FFFFFF"

[spacing]
scale = 1.28
scale-with-font = true
control-height = 32
popup-row-height = 36
control-padding-x = 16
control-padding-y = 8
popup-padding = 22
panel-padding = 24
row-padding-x = 18

[font]
base-size = 13
caption = 11
body-small = 12
body = 13
subtitle = 13
title = 14
heading = 16

[popups]
background       = "#000000"
background-alpha = 1.0
text             = "#FFFFFF"
border           = "#FFFFFF"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#000000"
background-alpha = 1.0
text             = "#FFFFFF"
border           = "#FFFFFF"
border-alpha     = 1.0

[notifications]
background       = "#FFFFFF"
background-alpha = 1.0
text             = "#000000"
border           = "#000000"
border-alpha     = 1.0
border-width     = 1
countdown        = "#000000"

[launcher]
background                = "#000000"
background-alpha          = 1.0
text                      = "#FFFFFF"
border                    = "#FFFFFF"
border-alpha              = 1.0
scrim                     = "#000000"
scrim-alpha               = 0.0
selected-background       = "#FFFFFF"
selected-background-alpha = 1.0
selected-text             = "#000000"
selected-border           = "#FFFFFF"
selected-border-alpha     = 0.0

[menu]
background                = "#000000"
background-alpha          = 1.0
text                      = "#FFFFFF"
border                    = "#FFFFFF"
border-alpha              = 1.0
scrim                     = "#000000"
scrim-alpha               = 0.0
selected-background       = "#FFFFFF"
selected-background-alpha = 1.0
selected-text             = "#000000"
selected-border           = "#000000"
selected-border-alpha     = 0.0

[polkit]
background       = "#000000"
background-alpha = 1.0
text             = "#FFFFFF"
text-error       = "#FFFFFF"
border           = "#FFFFFF"
border-error     = "#FFFFFF"
border-alpha     = 1.0
scrim            = "#000000"
scrim-alpha      = 1.0
accent           = "#FFFFFF"

[lock]
background       = "#000000"
background-alpha = 0.0
text             = "#FFFFFF"
placeholder      = "#FFFFFF"
text-error       = "#FFFFFF"
border           = "#FFFFFF"
border-active    = "#FFFFFF"
border-error     = "#FFFFFF"
border-alpha     = 1.0
selection        = "#FFFFFF"
selection-alpha  = 1.0

[image-picker]
scrim                   = "#000000"
scrim-alpha             = 0.0
text                    = "#FFFFFF"
selected-border         = "#FFFFFF"
selected-border-alpha   = 1.0
unselected-border       = "#FFFFFF"
unselected-border-alpha = 1.0
